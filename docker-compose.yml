# ============================================
# docker-compose.yml — EasyPanel Deploy
# Backend (Strapi) + Frontend (Next.js)
# O PostgreSQL fica como serviço separado no EasyPanel
# ============================================

services:
  # ── BACKEND: STRAPI ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
    volumes:
      - strapi_uploads:/app/public/uploads
    networks:
      - default
      - easypanel
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:1337/_health || exit 1" ]
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 5

  # ── FRONTEND: NEXT.JS ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-http://backend:1337}
      STRAPI_API_URL: ${STRAPI_API_URL:-http://backend:1337/api}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  strapi_uploads:
    driver: local

networks:
  easypanel:
    external: true
    name: easypanel
